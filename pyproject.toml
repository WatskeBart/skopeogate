[project]
name = "skopeogate"
version = "0.1.0"
description = "Webapplicatie om OCI-archieven via een uploadformulier naar een skopeo-bestemming te kopieren"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Shelling out to the fixed "skopeo" binary is the app's core purpose, and
# the process blocks the event loop only for the duration of the copy call.
"main.py" = ["S603", "S607", "ASYNC221", "ASYNC240"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults (File(...), Depends(...), etc.)
# are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
